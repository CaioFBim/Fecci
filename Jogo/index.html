<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG da Matemática</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            background-color: #34495e;
            border: 4px solid #f1c40f;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1, h2, h3 {
            color: #f1c40f;
            margin-bottom: 20px;
        }

        .hint {
            font-size: 0.9em;
            color: #bdc3c7;
            margin-bottom: 20px;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        button {
            background-color: #e67e22;
            color: white;
            border: 2px solid #d35400;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #d35400;
            transform: scale(1.05);
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1.2em;
            width: 70%;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 2px solid #7f8c8d;
            text-align: center;
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: bold;
            height: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 30px;
            border-radius: 10px;
            border: 4px solid #e67e22;
            text-align: center;
            max-width: 400px;
        }

        .modal-content img {
            max-width: 100%;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 2px solid #2c3e50;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-yes { background-color: #27ae60; border-color: #2ecc71; }
        .btn-yes:hover { background-color: #2ecc71; }
        .btn-no { background-color: #c0392b; border-color: #e74c3c; }
        .btn-no:hover { background-color: #e74c3c; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Tela 1: Quantidade de Jogadores -->
        <div id="screen-players" class="screen">
            <h1>Quantos aventureiros vão jogar?</h1>
            <div class="button-grid">
                <button onclick="setPlayers(1)">1 Jogador</button>
                <button onclick="setPlayers(2)">2 Jogadores</button>
                <button onclick="setPlayers(3)">3 Jogadores</button>
                <button onclick="setPlayers(4)">4 Jogadores</button>
                <button onclick="setPlayers(5)">5 Jogadores</button>
                <button onclick="setPlayers(6)">6 Jogadores</button>
            </div>
        </div>

        <!-- Tela 2: Seleção de Personagens -->
        <div id="screen-selection" class="screen hidden">
            <h2 id="player-turn">Jogador 1, escolha sua profissão!</h2>
            <p class="hint">Profissões: Mago, Clérico, Paladino, Arqueiro, Bárbaro, Druida.</p>
            
            <input type="text" id="class-input" placeholder="Digite a profissão..." autocomplete="off">
            <button onclick="checkCharacter()">Selecionar</button>
            
            <p id="error-msg" class="error"></p>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Você escolheu o <span id="confirm-name-display"></span>?</h3>
            <img id="confirm-image" src="" alt="Ficha do Personagem">
            <div class="modal-buttons">
                <button class="btn-yes" onclick="confirmSelection()">Sim, é este!</button>
                <button class="btn-no" onclick="cancelSelection()">Não, voltar</button>
            </div>
        </div>
    </div>

    <script>
        let maxPlayers = 0;
        let currentPlayer = 1;
        let selectedClasses = [];

        const classFileMap = {
            'mago': 'Mago.jpeg',
            'clerico': 'Clérico.jpeg',
            'clérico': 'Clérico.jpeg',
            'paladino': 'Paladino.jpeg',
            'arqueiro': 'Arqueiro.jpeg',
            'barbaro': 'Bárbaro.jpeg',
            'bárbaro': 'Bárbaro.jpeg',
            'druida': 'Druida.jpeg'
        };

        let pendingClass = ""; 

        function setPlayers(num) {
            maxPlayers = num;
            document.getElementById('screen-players').classList.add('hidden');
            document.getElementById('screen-selection').classList.remove('hidden');
            updateScreenText();
        }

        function updateScreenText() {
            document.getElementById('player-turn').innerText = `Jogador ${currentPlayer}, escolha sua profissão!`;
            document.getElementById('class-input').value = "";
            document.getElementById('error-msg').innerText = "";
            document.getElementById('class-input').focus();
        }

        function checkCharacter() {
            const inputField = document.getElementById('class-input');
            const typedClass = inputField.value.trim().toLowerCase();
            const errorMsg = document.getElementById('error-msg');

            if (!classFileMap[typedClass]) {
                errorMsg.innerText = "Profissão desconhecida! Tente novamente.";
                return;
            }

            const baseClass = classFileMap[typedClass]; 
            if (selectedClasses.includes(baseClass)) {
                errorMsg.innerText = "Esta profissão já foi escolhida por outro jogador!";
                return;
            }

            errorMsg.innerText = "";
            pendingClass = baseClass; 

            document.getElementById('confirm-name-display').innerText = typedClass.toUpperCase();
            document.getElementById('confirm-image').src = pendingClass; 
            document.getElementById('confirm-modal').classList.remove('hidden');
        }

        function confirmSelection() {
            selectedClasses.push(pendingClass);
            document.getElementById('confirm-modal').classList.add('hidden');

            if (currentPlayer < maxPlayers) {
                currentPlayer++;
                updateScreenText();
            } else {
                alert("Todos os personagens selecionados! Preparando o painel de batalha...");
            }
        }

        function cancelSelection() {
            document.getElementById('confirm-modal').classList.add('hidden');
            document.getElementById('class-input').focus();
        }
    </script>
</body>
</html>
